<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>KCQ Cloud Helper options</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 24px auto; display: grid; gap: 10px; }
    input { padding: 8px; font: inherit; }
    button { padding: 8px 12px; font: inherit; }
  </style>
</head>
<body>
  <h2>KCQ Cloud Helper</h2>
  <label>Supabase URL<br><input id="url" size="50" placeholder="https://xxxx.supabase.co"></label>
  <label>Supabase anon key<br><input id="key" size="50" type="password"></label>
  <button id="save">Save</button>
  <span id="status"></span>

  <h2>Suggested answers (AI)</h2>
  <label>Endpoint (OpenAI-compatible chat completions)<br><input id="aiEndpoint" size="50" placeholder="https://api.openai.com/v1/chat/completions"></label>
  <label>Model<br><input id="aiModel" size="50" placeholder="model name"></label>
  <label>API key<br><input id="aiKey" size="50" type="password"></label>
  <button id="saveAi">Save AI settings</button>
  <span id="aiStatus"></span>

  <h2>Module guides</h2>
  <label>Module name (must match the course title)<br><input id="guideName" size="50"></label>
  <label>Guide text (paste, or load a .txt / .md file)<br><textarea id="guideText" rows="8" cols="60"></textarea></label>
  <input id="guideFile" type="file" accept=".txt,.md">
  <button id="saveGuide">Save guide</button>
  <ul id="guideList"></ul>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
