<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KCQ Cloud</title><link rel="stylesheet" href="theme.css"></head>
<body class="sidepanel"><header class="brand-bar"><img src="icons/icon-48.png" width="40" height="40" alt=""><div class="brand-copy"><strong>KCQ Cloud</strong><small>Your shared question library</small></div><button id="themeToggle" class="secondary theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">Dark</button></header><main><section class="intro"><p class="eyebrow">MOODLE COMPANION</p><h1>A little help.<br>A lot of knowledge.</h1><p class="muted">Find your next answer in the shared library.</p></section>
<section class="surface search-panel" aria-label="Search questions"><label for="query">Find a question</label><input id="query" type="search" placeholder="Type the first words of a question…" autofocus><div class="row"><button id="selection">Use selected text</button><button id="refresh" class="secondary">Refresh</button></div></section>
<div id="status" class="status muted" role="status" aria-live="polite"></div><div id="results" aria-label="Saved questions"></div></main><footer>KCQ CLOUD HELPER <span>v1.1.0</span></footer>
<script src="theme.js"></script><script src="shared.js"></script><script src="sidepanel.js"></script></body></html>
